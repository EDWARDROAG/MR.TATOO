# Publica el frontend como vitrina estática (sin API, sin backend).
# URL esperada: https://edwardroag.github.io/mr-tatoo/
#
# Una sola vez en GitHub:
#   Settings → Pages → Build and deployment → Source: GitHub Actions
#   Settings → General → Danger zone: repo Private (recomendado)

name: Deploy vitrina (Pages)

on:
  push:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-vitrina.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-vitrina
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar y construir vitrina
        working-directory: frontend
        env:
          HUSKY: '0'
          VITE_VITRINA: 'true'
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm ci --ignore-scripts
          npm run build:pages
          cp dist/index.html dist/404.html

      - name: Verificar artefacto
        run: |
          test -f frontend/dist/index.html || (echo "❌ Falta frontend/dist/index.html" && exit 1)
          test -d frontend/dist/images/demo || (echo "❌ Faltan fotos demo" && exit 1)
          echo "✅ Se publicará frontend/dist/"

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Resumen
        run: |
          echo "## Vitrina Mr. Tatoo publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Solo frontend estático. Sin backend, sin .env de API, sin admin." >> "$GITHUB_STEP_SUMMARY"
          echo "- Repo: \`${{ github.repository }}\`" >> "$GITHUB_STEP_SUMMARY"
