server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 120M;

    # Visor MkDocs (HU-065) — no caer a SPA React
    location /docs/ {
        try_files $uri $uri/ =404;
        expires 1h;
        add_header Cache-Control "private";
    }

    # Imágenes estáticas (public/images) — NUNCA caer a index.html (rompe el <img>)
    location /images/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Assets hasheados de Vite
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://backend:3011/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 120M;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /uploads/ {
        proxy_pass http://backend:3011/uploads/;
        client_max_body_size 120M;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
