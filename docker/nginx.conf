# nginx.conf
# ============================================
# nginx.conf
# Configuración principal de Nginx para MiApp
# ============================================

# ============================================
# Configuración global
# ============================================
user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

# ============================================
# Eventos
# ============================================
events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

# ============================================
# HTTP - Configuración principal
# ============================================
http {
    # ========================================
    # Configuración básica
    # ========================================
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Seguridad
    server_tokens off;
    client_max_body_size 50M;
    client_body_buffer_size 128k;
    
    # Timeouts
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;
    keepalive_timeout 65;
    keepalive_requests 100;
    
    # Rendimiento
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    
    # Buffers
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    
    # Hash tables
    types_hash_max_size 2048;
    server_names_hash_bucket_size 128;
    
    # ========================================
    # Logging
    # ========================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';
    
    log_format json escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_response_time":"$upstream_response_time",'
        '"request_method":"$request_method",'
        '"scheme":"$scheme",'
        '"server_protocol":"$server_protocol"'
    '}';
    
    access_log /var/log/nginx/access.log json buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;
    
    # ========================================
    # Compresión Gzip
    # ========================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_disable "msie6";
    
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        text/js
        text/x-js
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/rss+xml
        application/x-httpd-php
        image/svg+xml
        image/x-icon
        image/vnd.microsoft.icon
        font/ttf
        font/otf
        font/woff
        font/woff2
        application/x-font-ttf
        application/x-font-opentype
        application/vnd.ms-fontobject;
    
    # ========================================
    # Cache de archivos estáticos
    # ========================================
    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;
    
    # ========================================
    # Rate Limiting
    # ========================================
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=30r/m;
    
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    
    # ========================================
    # Upstreams - Backend
    # ========================================
    upstream backend {
        least_conn;
        server backend:80 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    upstream websocket {
        least_conn;
        server backend:80;
        keepalive 32;
    }
    
    # ========================================
    # Headers de seguridad
    # ========================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # ========================================
    # Servidores
    # ========================================
    
    # --------------------------------------------------------
    # Servidor HTTP - Redirección a HTTPS
    # --------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;
        
        # Redirección a HTTPS
        return 301 https://$server_name$request_uri;
    }
    
    # --------------------------------------------------------
    # Servidor HTTPS principal
    # --------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name miapp.com www.miapp.com;
        
        # ========================================
        # SSL Configuration
        # ========================================
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/nginx/ssl/cert.pem;
        
        # ========================================
        # Root y logs
        # ========================================
        root /usr/share/nginx/html;
        index index.html index.htm;
        
        access_log /var/log/nginx/miapp_access.log json buffer=32k flush=5s;
        error_log /var/log/nginx/miapp_error.log;
        
        # ========================================
        # Health check
        # ========================================
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # ========================================
        # Archivos estáticos (con cache)
        # ========================================
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }
        
        # ========================================
        # HTML (sin cache en desarrollo)
        # ========================================
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            try_files $uri /index.html;
        }
        
        # ========================================
        # Service Worker (no cache)
        # ========================================
        location = /service-worker.js {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            access_log off;
        }
        
        # ========================================
        # Frontend SPA - React/Vue
        # ========================================
        location / {
            try_files $uri $uri/ /index.html;
            
            # Seguridad adicional
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
        }
        
        # ========================================
        # API Backend (Laravel)
        # ========================================
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://backend;
            proxy_http_version 1.1;
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Buffers
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            
            # Headers de cache
            proxy_cache_valid 200 1m;
            proxy_cache_bypass $http_cache_control;
            add_header X-Cache-Status $upstream_cache_status;
        }
        
        # ========================================
        # WebSocket
        # ========================================
        location /ws/ {
            proxy_pass http://websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 3600s;
        }
        
        # ========================================
        # Admin panel (con rate limiting)
        # ========================================
        location /admin/ {
            limit_req zone=admin_limit burst=5 nodelay;
            
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # ========================================
        # Login (rate limiting específico)
        # ========================================
        location /api/auth/login {
            limit_req zone=login_limit burst=1 nodelay;
            proxy_pass http://backend/api/auth/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        
        # ========================================
        # Uploads
        # ========================================
        location /uploads/ {
            alias /var/www/html/public/uploads/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        
        # ========================================
        # Storage
        # ========================================
        location /storage/ {
            alias /var/www/html/storage/app/public/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        
        # ========================================
        # Deny access to hidden files
        # ========================================
        location ~ /\.(?!well-known).* {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # ========================================
        # Deny access to sensitive directories
        # ========================================
        location ~ ^/(app|bootstrap|config|database|resources|routes|storage/framework|storage/logs|vendor)/ {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # ========================================
        # Deny access to PHP files
        # ========================================
        location ~ \.php$ {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # ========================================
        # Error pages
        # ========================================
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /50x.html {
            root /usr/share/nginx/html;
        }
        
        # ========================================
        # Status page (monitoring)
        # ========================================
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.0.0.0/8;
            deny all;
        }
    }
    
    # --------------------------------------------------------
    # Servidor para API (subdominio)
    # --------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.miapp.com;
        
        # SSL configuration
        ssl_certificate /etc/nginx/ssl/api-cert.pem;
        ssl_certificate_key /etc/nginx/ssl/api-key.pem;
        
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
        ssl_prefer_server_ciphers off;
        
        # Root
        root /var/www/html/public;
        
        # Logs
        access_log /var/log/nginx/api_access.log json buffer=32k flush=5s;
        error_log /var/log/nginx/api_error.log;
        
        # API endpoints
        location / {
            limit_req zone=api_limit burst=50 nodelay;
            
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # CORS headers para API
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
        }
    }
}

